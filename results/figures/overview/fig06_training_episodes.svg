<text x="24" y="453.0" font-size="10.5" fill="#8a8984">Training scenarios change with the curriculum (stage 1: 2–4 robots, 16×16; stage 3: dynamic, up to 8 robots), so values are not</text>
<text x="24" y="468.0" font-size="10.5" fill="#8a8984">comparable across stages or with validation. MADQL explores ε-greedily, PPO samples its policy.</text>
<text x="24" y="483.0" font-size="10.5" fill="#8a8984">The training log divides conflicts by NON-IDLE robot-steps (evaluation records divide by all robot-steps). Sources:</text>
<text x="24" y="498.0" font-size="10.5" fill="#8a8984">results/training/*/train_log.jsonl.</text>
</svg>
