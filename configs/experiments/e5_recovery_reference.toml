# PRELIMINARY E5 slice WITH ENDPOINT RECOVERY, reference controller (Project Issue #4 =
# GitHub issue #8; endpoint follow-up). NOT the full E5 experiment.
#
# Identical to e5_prelim_reference.toml in every factor, seed, scenario parameter, metric and cap; the only
# difference is `endpoint = "on"` (idle-robot parking and retreat from a persistently held task
# goal, docs/04 §5.6, with the fixed parameters W = 4, H = 8, M = 3). Runs pair with
# results/experiments/e5_prelim_reference/ (no recovery) by (planner, allocator, dynamics, seed). Written to
# its own directory, so the no-recovery records stay untouched.
#
#   python -m robocoord experiment --config configs/experiments/e5_recovery_reference.toml
#   python -m robocoord.experiments.e5_diagnostics results/experiments/e5_recovery_reference configs/experiments/e5_recovery_reference.toml
#   python -m robocoord.experiments.allocation_analysis compare-recovery results/experiments/e5_prelim_reference results/experiments/e5_recovery_reference results/experiments/e5_recovery_reference_comparison.md

[experiment]
name = "e5_recovery_reference"
kind = "system_episode"
description = "Preliminary non-learned E5 slice with endpoint recovery: reference (pairs with e5_prelim_reference)"
seed_base = 20200
timeout_s = 900.0
workers = 10

[factors]
planner = ["astar", "rrtstar"]
allocator = ["auction", "sequential"]
dynamics = ["static", "obstacles", "full"]
seed = [20200, 20201, 20202, 20203, 20204, 20205, 20206, 20207, 20208, 20209,
        20210, 20211, 20212, 20213, 20214, 20215, 20216, 20217, 20218, 20219,
        20220, 20221, 20222, 20223, 20224, 20225, 20226, 20227, 20228, 20229,
        20230, 20231, 20232, 20233, 20234, 20235, 20236, 20237, 20238, 20239,
        20240, 20241, 20242, 20243, 20244, 20245, 20246, 20247, 20248, 20249]

[fixed]
endpoint = "on"
controller = "reference"
size = 32
density = 0.15
robots = 8
tasks_per_robot = 2
obstacles = 8
max_steps = 400
arrival_rate = 0.05
arrivals_until = 200

[[planners]]
label = "astar"
name = "astar"

[[planners]]
label = "rrtstar"
name = "rrtstar"
options = { max_iterations = 1000 }
