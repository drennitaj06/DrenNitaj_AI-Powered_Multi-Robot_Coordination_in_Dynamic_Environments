# PRELIMINARY E5 slice, reference-follower half (Project Issue #4 = GitHub issue #8).
# NOT the full E5 experiment.
#
# Together with configs/experiments/e5_prelim.toml (baseline half) this is the preliminary
# NON-LEARNED E5 requested by Project Issue #4: planner {A*, RRT*} × allocator {auction,
# sequential} × dynamics {static, obstacles, full} × controller {baseline, reference} × 50 test
# seeds = 1 200 episodes. The learned controllers (MADQL, PPO) and the shield ablation remain for
# Project Issues #5/#6 (preliminary) and Project Issue #8 (final evaluation) of
# docs/07-development-plan.md — that "Issue #8" is a plan issue, not GitHub issue #8.
#
# Identical to e5_prelim.toml in every factor, seed, scenario parameter, metric and cap; only
# the controller differs: the reference follower with its documented CLI defaults (deadlock
# resolver off, shield off). Runs are paired with the baseline half by (planner, allocator,
# dynamics, seed). Written to its own directory so the baseline records are untouched.
#
#   python -m robocoord experiment --config configs/experiments/e5_prelim_reference.toml
#   python -m robocoord.experiments.analysis results/experiments/e5_prelim_reference

[experiment]
name = "e5_prelim_reference"
kind = "system_episode"
description = "Preliminary non-learned E5 slice: reference follower (pairs with e5_prelim)"
seed_base = 20200
timeout_s = 900.0
workers = 10

[factors]
planner = ["astar", "rrtstar"]
allocator = ["auction", "sequential"]
dynamics = ["static", "obstacles", "full"]
seed = [20200, 20201, 20202, 20203, 20204, 20205, 20206, 20207, 20208, 20209,
        20210, 20211, 20212, 20213, 20214, 20215, 20216, 20217, 20218, 20219,
        20220, 20221, 20222, 20223, 20224, 20225, 20226, 20227, 20228, 20229,
        20230, 20231, 20232, 20233, 20234, 20235, 20236, 20237, 20238, 20239,
        20240, 20241, 20242, 20243, 20244, 20245, 20246, 20247, 20248, 20249]

[fixed]
controller = "reference"
size = 32
density = 0.15
robots = 8
tasks_per_robot = 2
obstacles = 8
max_steps = 400
arrival_rate = 0.05
arrivals_until = 200

[[planners]]
label = "astar"
name = "astar"

[[planners]]
label = "rrtstar"
name = "rrtstar"
options = { max_iterations = 1000 }
