# MADQL training configuration (Issue #5; algorithms §6, design R7/D).
# Run: python -m robocoord train --config configs/training/madql.toml --seed 1 --out results/training/madql_seed1
# Training root seeds are 1, 2 and 3 (approved). The scenario-sampling order (sampler_seed) is the
# same for every run; the algorithm's random streams are derived from the run seed only.
# Step counts are environment steps summed over the n_envs copies (D3). total_steps = 1 000 000
# was fixed from the measured throughput of this trainer (about 300 environment steps/s in stage
# 3 with updates, observation building included; see docs/verification-log.md V-14) and is the
# same for every run seed. A* only (approved).

[run]
name = "madql"
run_seed = 1
total_steps = 1000000
n_envs = 4
sampler_seed = 0
log_interval = 10000
deterministic = true
threads = 1

[madql]
lr = 5e-4
batch_size = 256
buffer_size = 200000
warmup = 10000
train_freq = 4
target_period = 2000
gamma = 0.99
eps_start = 1.0
eps_end = 0.05
eps_fraction = 0.3
grad_clip = 10.0
hidden = [256, 256]

[env]
planner = "astar"
allocator = "auction"
endpoint = true
deadlock = false
shield = "off"

[obs]
radius = 3
path_cells = 6
max_priority = 3

[reward]
c_step = 0.01
zeta = 1.0
r_pick = 0.5
r_del = 1.0
c_rr = 1.0
c_ro = 1.0
c_sh = 0.5
beta = 0.3
gamma = 0.99

[validation]
interval = 50000
rrt_interval = 250000
rrt = true
workers = 3
