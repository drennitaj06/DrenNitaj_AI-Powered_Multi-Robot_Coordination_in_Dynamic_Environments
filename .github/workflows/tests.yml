name: tests

on:
  push:
  pull_request:

jobs:
  quality:
    name: lint, format, types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # mypy needs torch's types once src/robocoord/marl imports torch (Issue #5); CPU wheel only.
      - name: Install (dev + marl, CPU-only PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,marl]" --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy

  tests:
    name: fast tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: ubuntu-latest, python: "3.14" }
          - { os: windows-latest, python: "3.14" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The CPU wheel index keeps Linux runners from downloading the CUDA build of PyTorch.
      - name: Install (dev + marl, CPU-only PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,marl]" --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Verify CPU-only PyTorch
        run: python -c "import torch; assert torch.version.cuda is None, torch.version.cuda; print(torch.__version__)"
      - name: Fast test suite
        run: pytest
